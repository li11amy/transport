
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios de transporte</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
  margin: 0;
  padding: 16px;
}

.wrapper {
  max-width: 480px;
  margin: 0 auto;
}

h1 {
  font-size: 26px;
  margin: 0 0 14px 0;
}

.controls {
  display: grid;
  gap: 12px;
  margin-bottom: 14px;
}

.direction-toggle {
  border: 1px solid #2d6cdf;
  background: #2d6cdf;
  color: white;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  width: 100%;
  text-align: center;
  box-sizing: border-box;
}

.toolbar {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  align-items: stretch;
}

.filters {
  display: contents;
}

.day-toggle,
.filter-chip {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 8px 6px;
  border-radius: 999px;
  cursor: pointer;
  font-size: clamp(11px, 3vw, 13px);
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
}

.day-toggle {
  border: 1px solid #9ca3af;
  background: #ffffff;
  color: #4b5563;
  font-weight: 600;
}

.day-toggle.weekend {
  border-color: #22c55e;
  background: #ffffff;
  color: #15803d;
}

.filter-chip {
  border: 1px solid #d7dbe3;
  background: #ffffff;
  color: #4b5563;
}

.filter-chip.active {
  background: #eef4ff;
  border-color: #9db8ee;
  color: #1f4fa8;
  font-weight: 600;
}

.section {
  background: #ffffff;
  border-radius: 12px;
  padding: 10px;
  border: 1px solid #ddd;
}

.hidden {
  display: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  max-width: 420px;
  margin: 0 auto;
}

th {
  text-align: center;
  font-size: 14px;
  color: #666;
  padding: 6px 6px;
  border-bottom: 1px solid #ddd;
}

td {
  padding: 8px 6px;
  border-bottom: 1px solid #eee;
  font-size: 16px;
  text-align: center;
}

tr:last-child td {
  border-bottom: none;
}

td:nth-child(1), th:nth-child(1) {
  width: 70px;
}

td:nth-child(2), th:nth-child(2) {
  width: 70px;
}

td:nth-child(3), th:nth-child(3) {
  width: 80px;
  color: #444;
}

.empty-note {
  text-align: center;
  color: #666;
  font-size: 14px;
  padding: 12px 0 4px;
}
</style>
</head>
<body>
<div class="wrapper">

<h1>Horarios de transporte</h1>

<div class="controls">
  <button id="directionBtn" class="direction-toggle" type="button" onclick="toggleDirection()">
    El Puerto → Cádiz
  </button>

  <div class="toolbar">
    <button id="dayToggleBtn" class="day-toggle" type="button" onclick="toggleWeekend()">
      Laboral
    </button>

    <div class="filters">
      <button class="filter-chip active" data-filter="catamaran" type="button" onclick="toggleFilter(this)">⛴ Barco</button>
      <button class="filter-chip active" data-filter="bus" type="button" onclick="toggleFilter(this)">🚌 Bus</button>
      <button class="filter-chip active" data-filter="tren" type="button" onclick="toggleFilter(this)">🚆 Tren</button>
    </div>
  </div>
</div>

<div id="ida_lv" class="section">
  <table>
    <tr><th>Salida</th><th>Llegada</th><th>Línea</th></tr>
    
  </table>
  <div class="empty-note hidden">No hay servicios para los filtros elegidos.</div>
</div>

<div id="ida_sdf" class="section hidden">
  <table>
    <tr><th>Salida</th><th>Llegada</th><th>Línea</th></tr>
    
  </table>
  <div class="empty-note hidden">No hay servicios para los filtros elegidos.</div>
</div>

<div id="vuelta_lv" class="section hidden">
  <table>
    <tr><th>Salida</th><th>Llegada</th><th>Línea</th></tr>
    
  </table>
  <div class="empty-note hidden">No hay servicios para los filtros elegidos.</div>
</div>

<div id="vuelta_sdf" class="section hidden">
  <table>
    <tr><th>Salida</th><th>Llegada</th><th>Línea</th></tr>
    
  </table>
  <div class="empty-note hidden">No hay servicios para los filtros elegidos.</div>
</div>

<script>
let currentDirection = 'ida';
let isWeekend = false;

function getCurrentSectionId() {
  if (currentDirection === 'ida') {
    return isWeekend ? 'ida_sdf' : 'ida_lv';
  }
  return isWeekend ? 'vuelta_sdf' : 'vuelta_lv';
}

function getFilterButtons() {
  return Array.from(document.querySelectorAll('.filter-chip'));
}

function getActiveFilters() {
  return getFilterButtons()
    .filter(el => el.classList.contains('active'))
    .map(el => el.dataset.filter);
}

function updateDirectionButton() {
  const btn = document.getElementById('directionBtn');
  btn.textContent = currentDirection === 'ida'
    ? 'El Puerto → Cádiz'
    : 'Cádiz → El Puerto';
}

function updateDayButton() {
  const btn = document.getElementById('dayToggleBtn');
  btn.textContent = isWeekend ? 'Finde' : 'Laboral';
  btn.classList.toggle('weekend', isWeekend);
}

function updateVisibleSection() {
  const visibleId = getCurrentSectionId();

  document.querySelectorAll('.section').forEach(el => {
    el.classList.add('hidden');
  });

  document.getElementById(visibleId).classList.remove('hidden');
}

function applyFilters() {
  let active = getActiveFilters();

  if (active.length === 0) {
    getFilterButtons().forEach(el => el.classList.add('active'));
    active = getActiveFilters();
  }

  document.querySelectorAll('.section').forEach(section => {
    let visibleRows = 0;

    section.querySelectorAll('tr[data-type]').forEach(row => {
      const type = row.dataset.type;
      const show = active.includes(type);
      row.style.display = show ? '' : 'none';
      if (show) visibleRows++;
    });

    const emptyNote = section.querySelector('.empty-note');
    if (emptyNote) {
      emptyNote.classList.toggle('hidden', visibleRows !== 0);
    }
  });
}

function updateView() {
  updateDirectionButton();
  updateDayButton();
  updateVisibleSection();
  applyFilters();
}

function toggleDirection() {
  currentDirection = currentDirection === 'ida' ? 'vuelta' : 'ida';
  updateView();
}

function toggleWeekend() {
  isWeekend = !isWeekend;
  updateView();
}

function toggleFilter(btn) {
  const buttons = getFilterButtons();
  const activeBefore = getActiveFilters();

  if (activeBefore.length === buttons.length) {
    buttons.forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
    return;
  }

  btn.classList.toggle('active');
  applyFilters();
}

document.addEventListener('DOMContentLoaded', () => {
  updateView();
});
</script>

</div>
</body>
</html>
