name: Source-backed Renfe strike alerts
on:
  push:
    branches: [fix/renfe-strike-29oct-2026]
    paths:
      - "source_alerts.py"
      - "service_alerts.json"
      - "transport_updates.py"
      - "build_horarios.py"
      - "tests/test_source_alerts.py"
      - ".github/workflows/verify-source-alerts.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy/*.sh
      - run: |
          python - <<'PY'
          from build_horarios import HTML
          from pathlib import Path
          Path("/tmp/timetable.js").write_text(HTML.split("<script>",1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/timetable.js
