name: Diagnose maritime status and PWA files
on:
  push:
    paths:
      - 'scripts/diagnose_maritime_pwa.py'
      - '.github/workflows/diagnose-maritime-pwa.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/diagnose_maritime_pwa.py
