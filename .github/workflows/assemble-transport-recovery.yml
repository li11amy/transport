name: Assemble interrupted transport upgrades
on:
  push:
    branches: [fix/transport-recovery-20261029]
    paths: [.github/workflows/assemble-transport-recovery.yml]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transport-recovery-20261029
          fetch-depth: 0
          persist-credentials: true
      - name: Merge previously tested maritime changes into PWA recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/maritime-live-pwa-diagnostics-20261028
          git merge --no-ff -X ours origin/fix/maritime-live-pwa-diagnostics-20261028             -m "Integrate CMTBC BOM maritime status with Android PWA fixes"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - name: Validate merged product and both independent bug regressions
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q build_horarios.py transport_updates.py maritime_status.py tests
          bash -n deploy/*.sh
          python - <<'PY'
          from pathlib import Path
          from build_horarios import HTML
          assert 'id="boatReference"' in HTML
          assert "manifest.json?v=2" in HTML
          s=Path("maritime_status.py").read_text()
          assert 'decode("utf-8-sig")' in s
          assert 'Path("output").mkdir' in Path("deploy/apply-transport-recovery.sh").read_text()
          PY
      - name: Push tested combined branch
        run: git push origin HEAD:fix/transport-recovery-20261029
