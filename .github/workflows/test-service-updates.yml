name: Transport service changes tests
on:
  push:
    paths:
      - "transport_updates.py"
      - "build_horarios.py"
      - "tests/**"
      - "deploy/**"
      - "sw.js"
      - ".github/workflows/test-service-updates.yml"
  pull_request:
    paths:
      - "transport_updates.py"
      - "build_horarios.py"
      - "tests/**"
      - "deploy/**"
      - "sw.js"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m compileall -q build_horarios.py transport_updates.py tests
      - run: python -m unittest discover -s tests -v
      - name: Check real Renfe GTFS join (network may be transient)
        run: python scripts/smoke_renfe_join.py
        continue-on-error: true
      - run: bash -n deploy/*.sh
      - run: python -m py_compile deploy/enable-nginx-transport.py
