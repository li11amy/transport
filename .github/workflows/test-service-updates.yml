name: Transport service changes tests
on:
  push:
    paths:
      - "transport_updates.py"
      - "build_horarios.py"
      - "tests/**"
      - "deploy/**"
      - "sw.js"
      - "scripts/compare_android_install.cjs"
      - ".github/workflows/test-service-updates.yml"
  pull_request:
    paths:
      - "scripts/compare_android_install.cjs"
      - ".github/workflows/test-service-updates.yml"
      - "transport_updates.py"
      - "build_horarios.py"
      - "tests/**"
      - "deploy/**"
      - "sw.js"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m compileall -q build_horarios.py transport_updates.py tests
      - run: python -m unittest discover -s tests -v
      - name: Validate timetable inline JavaScript
        run: |
          python - <<'PY'
          from build_horarios import HTML
          from pathlib import Path
          source = HTML.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/transport-ui.js").write_text(source, encoding="utf-8")
          PY
          node --check /tmp/transport-ui.js
      - name: Compare current transport vs Bottle Butler Android PWA installability
        run: |
          npm install --no-save puppeteer-core
          node scripts/compare_android_install.cjs
        continue-on-error: true
      - name: Check real Renfe GTFS join (network may be transient)
        run: PYTHONPATH=. python scripts/smoke_renfe_join.py
        continue-on-error: true
      - run: bash -n deploy/*.sh
      - run: python -m py_compile deploy/enable-nginx-transport.py
      - name: Check subdomain certificate bootstrap scripts
        run: |
          bash -n deploy/subdomain/*.sh
          python -m py_compile deploy/subdomain/*.py
