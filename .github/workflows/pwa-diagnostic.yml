name: Diagnose PWA installability
on:
  push:
    paths:
      - '.github/workflows/pwa-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Chrome and install diagnostics
        run: |
          node --version
          google-chrome --version || chromium --version
          mkdir -p /tmp/inspect-pwa
          cd /tmp/inspect-pwa
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@24 >/dev/null
          cat > test.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage();
            p.on('console',msg=>console.log('CONSOLE',msg.type(),msg.text()));
            p.on('pageerror',e=>console.log('PAGEERROR',e.message));
            p.on('requestfailed',r=>console.log('REQUEST_FAILED',r.url(),r.failure()?.errorText));
            await p.goto('https://li11amy.github.io/transport/',{waitUntil:'networkidle2',timeout:60000});
            const session=await p.createCDPSession();
            await session.send('Page.enable');
            console.log('MANIFEST',JSON.stringify(await session.send('Page.getAppManifest')));
            await new Promise(r=>setTimeout(r,6000));
            try{ console.log('INSTALLABILITY',JSON.stringify(await session.send('Page.getInstallabilityErrors'))); }catch(e){console.log('INSTALLABILITY_EXCEPTION',e.message)}
            console.log('SWSTATE',JSON.stringify(await p.evaluate(async()=>({
              controller:!!navigator.serviceWorker.controller,
              registrations:(await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,active:r.active?.state,installing:r.installing?.state,waiting:r.waiting?.state})),
              cacheNames:await caches.keys(),
              images:await Promise.all([192,512].map(async n=>{let img=new Image();img.src='/transport/icon-'+n+'.png';try{await img.decode();return {n,width:img.width,height:img.height}}catch(e){return {n,error:e.message}}}))
            }))));
            await b.close();
          })().catch(e=>{console.error('FATAL',e.stack);process.exit(1)});
          JS
          node test.cjs
