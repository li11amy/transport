name: Verify versioned Android PWA launcher
on:
  push:
    branches: [feature/transport-root-subdomain-20261029]
    paths:
      - "deploy/subdomain/build_root.py"
      - "deploy/subdomain/publish-versioned-icons.py"
      - "tests/test_subdomain_root.py"
      - "tests/test_pwa_icon_refresh.py"
      - ".github/workflows/verify-root-icons.yml"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m compileall -q deploy/subdomain
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy/subdomain/*.sh
