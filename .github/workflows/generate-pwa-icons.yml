name: Generate RGB transport PWA icons (one time)
on:
  push:
    branches:
      - fix/android-transport-pwa-install-20261028
    paths:
      - scripts/convert_pwa_icons.py
      - .github/workflows/generate-pwa-icons.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow
      - run: python scripts/convert_pwa_icons.py
      - name: Validate RGB PNG headers
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("icon-192-rgb.png","icon-512-rgb.png","icon-512-maskable.png"):
              data=Path(name).read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n"
              assert data[25]==2, (name,data[25])
              print(name, len(data), "bytes RGB")
          PY
      - name: Commit generated icon assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192-rgb.png icon-512-rgb.png icon-512-maskable.png
          git diff --cached --quiet || git commit -m "Add truecolor Android PWA icons and maskable artwork"
          git push origin HEAD:fix/android-transport-pwa-install-20261028
