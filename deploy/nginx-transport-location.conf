# Insert both locations INSIDE the existing HTTPS server {} block for
# peluche-ebanache.com. Do not include at nginx http {} scope.
# No changes to AVÍO's proxy / location.
location = /transport {
    return 308 /transport/;
}

location = /transport/transport_data.json {
    alias /srv/www/transport/transport_data.json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /transport/ {
    alias /srv/www/transport/;
    index index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
